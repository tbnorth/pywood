[project]
name = "pywood"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Terry N. Brown", email = "terrynbrown@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.3",
    "pytest>=8.3.5",
]

[project.scripts]
pywood = "pywood:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
# requires = ['setuptools']
# build-backend = 'setuptools.build_meta'

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = [
  "src"
]
